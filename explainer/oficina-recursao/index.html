<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina de Recursão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mapa de fases fixo à esquerda (pilha de mundos), bancada de trabalho à direita com código, peças e o traço da recursão */
:root {
  --bg: #F1F4F1;
  --surface: #FFFFFF;
  --sunk: #E5EAE5;
  --ink: #17201B;
  --muted: #56635C;
  --line: #CFD7D0;
  --accent: #B8337A;
  --accent-soft: #F6DDEA;
  --accent-ink: #FFFFFF;
  --ok: #1B7556;
  --ok-bg: #DCEFE5;
  --bad: #AE3B27;
  --bad-bg: #F7E1DB;
  --star: #C98A12;
  --code-bg: #18201C;
  --code-fg: #E3EAE5;
  --code-line: #2A3530;
  --code-hl: rgba(243, 143, 198, 0.17);
  --kw: #F38FC6;
  --ty: #86D4B2;
  --num: #F1C56C;
  --str: #B9DB8B;
  --com: #7E8D86;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #19201C; --sunk: #212925; --ink: #E4EBE6; --muted: #9AA8A1; --line: #2D3832;
    --accent: #EE7DB9; --accent-soft: #3A1F2E; --accent-ink: #1B0E15;
    --ok: #62CC9F; --ok-bg: #163428; --bad: #F0907A; --bad-bg: #3A1F19; --star: #F0BE4E;
    --code-bg: #0B0F0D; --code-fg: #E3EAE5; --code-line: #212A26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #19201C; --sunk: #212925; --ink: #E4EBE6; --muted: #9AA8A1; --line: #2D3832;
  --accent: #EE7DB9; --accent-soft: #3A1F2E; --accent-ink: #1B0E15;
  --ok: #62CC9F; --ok-bg: #163428; --bad: #F0907A; --bad-bg: #3A1F19; --star: #F0BE4E;
  --code-bg: #0B0F0D; --code-fg: #E3EAE5; --code-line: #212A26;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
}
.app {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px;
}
header.top {
  grid-column: 1 / -1;
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
  border-bottom: 2px solid var(--ink); padding-bottom: 14px;
}
header.top h1 {
  font-family: var(--f-display); font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.4rem);
  line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance;
}
header.top h1 .paren { color: var(--accent); }
header.top p { margin: 6px 0 0; color: var(--muted); }
.score {
  font-family: var(--f-code); font-size: 0.95rem; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 10px;
}
.score .stars { color: var(--star); font-weight: 600; }
.reset { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 0.8rem; cursor: pointer; }
.reset:hover { color: var(--ink); border-color: var(--muted); }

/* mapa */
nav.map { display: flex; flex-direction: column; gap: 18px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.world { display: flex; flex-direction: column; gap: 4px; }
.world-btn {
  all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 6px 8px; border-radius: 6px;
}
.world-btn:focus-visible, .lv:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.world-btn .wname { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.world-btn .wtag { font-family: var(--f-code); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.world-btn.on { background: var(--accent-soft); }
.lv {
  all: unset; cursor: pointer; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px;
  padding: 5px 8px 5px 10px; border-left: 2px solid var(--line); margin-left: 12px; font-size: 0.92rem;
}
.lv .n { font-family: var(--f-code); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lv .st { font-size: 0.75rem; color: var(--star); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.lv .st .off { color: var(--line); }
.lv:hover { background: var(--sunk); }
.lv.on { border-left-color: var(--accent); background: var(--sunk); font-weight: 700; }
.lv.locked { cursor: not-allowed; color: var(--muted); opacity: 0.55; }
.lv.locked:hover { background: none; }

/* painel */
main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { font-family: var(--f-code); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.eyebrow b { color: var(--accent); font-weight: 600; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.5rem, 3.4vw, 2rem); line-height: 1.1; margin: 4px 0 8px; letter-spacing: -0.015em; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; margin: 0 0 8px; }
.prose { max-width: 66ch; }
.prose p { margin: 0 0 10px; }

.code {
  background: var(--code-bg); color: var(--code-fg); border-radius: 10px;
  font-family: var(--f-code); font-size: 0.9rem; line-height: 1.7;
  overflow-x: auto; padding: 16px 0; min-width: 0;
}
.code pre { margin: 0; padding: 0 18px; font: inherit; white-space: pre; }
.code.lines { padding: 12px 0; font-size: 0.86rem; }
.k { color: var(--kw); } .t { color: var(--ty); } .nm { color: var(--num); } .s { color: var(--str); } .c { color: var(--com); font-style: italic; }

.cl { white-space: pre; padding: 0 16px 0 13px; border-left: 3px solid transparent; }
.cl .ln, .bugline .ln { color: var(--com); display: inline-block; width: 3ch; user-select: none; }
.cl.on { background: var(--code-hl); border-left-color: var(--kw); }
.cl.on .ln { color: var(--kw); }
.fillv { color: var(--ty); border-bottom: 1px dotted var(--ty); }

.slot {
  display: inline-block; min-width: 4.5ch; padding: 0 6px; margin: 1px 0;
  border: 1.5px dashed var(--kw); border-radius: 5px; color: var(--code-fg);
  cursor: pointer; font: inherit; background: transparent; line-height: 1.45; text-align: center;
}
.slot.empty { color: var(--com); }
.slot.active { border-style: solid; background: color-mix(in srgb, var(--kw) 22%, transparent); }
.slot.wrong { border: 1.5px solid #F0907A; color: #F7B3A4; text-decoration: line-through; }

.bugline { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 0 18px 0 15px; cursor: pointer; white-space: pre; border-left: 3px solid transparent; }
.bugline:hover { background: var(--code-line); }
.bugline:focus-visible { outline: 2px solid var(--kw); outline-offset: -2px; }
.bugline.wrong { border-left-color: #F0907A; background: rgba(240,144,122,0.12); }

.bank { display: flex; flex-direction: column; gap: 8px; }
.bank-label { font-size: 0.9rem; color: var(--muted); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile {
  font-family: var(--f-code); font-size: 0.88rem; padding: 7px 12px; border-radius: 7px;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); cursor: pointer;
  box-shadow: 0 2px 0 var(--line);
}
.tile:hover { border-color: var(--accent); box-shadow: 0 2px 0 var(--accent); }
.tile:focus-visible, .btn:focus-visible, .slot:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile.chosen { background: var(--accent-soft); border-color: var(--accent); }

.question { font-size: 1.02rem; }
.question .call { font-family: var(--f-code); font-weight: 600; background: var(--sunk); padding: 2px 8px; border-radius: 5px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; max-width: 560px; }
.opt {
  font-family: var(--f-code); font-size: 1rem; padding: 12px; border-radius: 8px; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 2px 0 var(--line);
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.opt:disabled { cursor: default; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font-family: var(--f-body); font-weight: 700; font-size: 0.95rem; padding: 9px 18px; border-radius: 8px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.4; cursor: default; }

.feedback { padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; max-width: 70ch; }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback.hint { background: var(--sunk); color: var(--ink); border-left: 3px solid var(--star); }

.result { border-top: 2px solid var(--ink); padding-top: 18px; display: flex; flex-direction: column; gap: 16px; }
.won { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.won .bigstars { font-size: 1.6rem; color: var(--star); letter-spacing: 3px; }
.won .bigstars .off { color: var(--line); }
.won h3 { margin: 0; }

/* acompanhamento */
.follow { display: flex; flex-direction: column; gap: 12px; }
.follow-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.follow-head h3 { margin: 0; }
.stepper { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper .count { font-family: var(--f-code); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 0.97rem; min-height: 1.6em; max-width: 70ch; padding: 10px 14px; background: var(--accent-soft); border-radius: 8px; }
.note b { color: var(--accent); }
.trace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 300px); gap: 14px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.vars { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.vars .lab { font-family: var(--f-code); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.vars .vchips { display: flex; flex-wrap: wrap; gap: 6px; }
.vchip { font-family: var(--f-code); font-size: 0.82rem; padding: 3px 8px; border-radius: 5px; background: var(--sunk); overflow-wrap: anywhere; }
.steps { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 0; overflow-x: auto; min-width: 0; }
.steps .lab { font-family: var(--f-code); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 16px 6px; }
.step { font-family: var(--f-code); font-size: 0.86rem; padding: 3px 16px; white-space: pre; color: var(--muted); }
.step.cur { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.keys { font-size: 0.8rem; color: var(--muted); }
kbd { font-family: var(--f-code); font-size: 0.75rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

svg.tree { max-width: 100%; height: auto; display: block; }
svg.tree .edge { stroke: var(--muted); stroke-width: 1.5; fill: none; }
svg.tree .node { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
svg.tree .node.hl { fill: var(--accent); stroke: var(--accent); }
svg.tree text { fill: var(--ink); font-family: var(--f-code); font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
svg.tree text.hl { fill: var(--accent-ink); }
.treebox { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.treebox .cap { font-size: 0.75rem; color: var(--muted); font-family: var(--f-code); }

/* intro de mundo */
.recipe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.recipe div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.recipe .q { font-family: var(--f-code); font-size: 0.75rem; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; }
.recipe p { margin: 4px 0 0; font-size: 0.93rem; }
.anatomy { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--f-code); font-size: 0.95rem; }
.chip { padding: 6px 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); }
.chip.a { border-color: var(--accent); background: var(--accent-soft); }
.arrow { color: var(--muted); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.map { position: static; flex-direction: row; overflow-x: auto; gap: 14px; padding-bottom: 6px; }
  .world { min-width: 230px; }
  .trace { grid-template-columns: minmax(0, 1fr); }
  .recipe { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .result { animation: rise .35s ease-out; }
  .cl { transition: background-color .2s; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1><span class="paren">(</span>Oficina de Recursão<span class="paren">)</span></h1>
      <p>Listas, naturais e árvores binárias em Gleam, uma fase de cada vez.</p>
    </div>
    <div class="score"><span class="stars" id="score"></span><button class="reset" id="reset" type="button">Zerar progresso</button></div>
  </header>
  <nav class="map" id="map" aria-label="Fases"></nav>
  <main id="main"></main>
</div>

<script>
// ---------- árvores ----------
const T = (v, l = null, r = null) => ({ v, l, r });
const ARV_P = T(5, T(3), T(8));
const ARV_Q = T(5, T(3, T(1)), T(8));
const ARV_R = T(5, T(3, T(1, null, T(2))), T(8));
const ARV_E = T(5, T(3, T(1)), T(8, null, T(9)));
const ARV_E_ESP = T(5, T(8, T(9)), T(3, null, T(1)));
const ARV_ABB = T(5, T(3, T(1), T(4)), T(8, null, T(9)));

// passo do acompanhamento: linhas (base 0), expressão, variáveis, explicação, nós destacados, árvore nova
const S = (ln, e, v = "", n = "", m = null, t = null) => ({ ln: Array.isArray(ln) ? ln : [ln], e, v, n, m, t });

// ---------- conteúdo ----------
const WORLDS = [
{
  id: "listas", name: "Listas", tag: "[primeiro, ..resto]",
  lead: "Uma lista é vazia, ou é um primeiro elemento grudado num resto que também é lista. A função segue essa forma: um caso para cada formato.",
  anatomy: [["[4, 1, 5]", ""], ["→", "arrow"], ["4", "a"], ["..", "arrow"], ["[1, 5]", ""]],
  template: `pub fn f(lst: List(Int)) -> Resultado {
  case lst {
    [] -> // resposta para a lista vazia
    [primeiro, ..resto] -> // combina primeiro com f(resto)
  }
}`,
  recipe: [
    ["caso base", "O que a função devolve para []? Costuma ser o elemento neutro: 0 para soma, [] para listas, True para \"todos\"."],
    ["fica menor", "A chamada recursiva sempre recebe resto. Se chamar com lst de novo, nunca termina."],
    ["combina", "Junte primeiro com o resultado de f(resto): somando, colocando na frente com [x, ..], ou decidindo com case."]
  ],
  levels: [
    { id: "l1", kind: "fill", title: "Somar uma lista",
      prompt: "A soma de [] é 0. A soma de uma lista não vazia é o primeiro mais a soma do resto. Complete as duas lacunas.",
      code: `pub fn soma(lst: List(Int)) -> Int {
  case lst {
    [] -> {{0}}
    [primeiro, ..resto] -> primeiro + {{1}}
  }
}`,
      blanks: [["0", "1", "[]"], ["soma(resto)", "soma(lst)", "resto", "soma(primeiro)"]],
      hint: "O caso base precisa ser um Int que não altere a soma. E a chamada recursiva tem que receber algo menor do que lst.",
      explain: "O caso base é 0 porque somar 0 não muda nada. A chamada <b>soma(resto)</b> trabalha numa lista menor, então em algum momento chega em []. Se fosse soma(lst), a função chamaria a si mesma com a mesma lista para sempre.",
      trace: [
        S(0, "soma([4, 1, 5])", "lst = [4, 1, 5]", "A função é chamada com a lista inteira."),
        S([1, 3], "= 4 + soma([1, 5])", "primeiro = 4 · resto = [1, 5]", "A lista não é vazia, então casa com [primeiro, ..resto]. O 4 fica <b>esperando</b> o resultado de soma(resto)."),
        S([1, 3], "= 4 + (1 + soma([5]))", "primeiro = 1 · resto = [5]", "Nova chamada, mesma linha, outras variáveis. Cada chamada tem as suas."),
        S([1, 3], "= 4 + (1 + (5 + soma([])))", "primeiro = 5 · resto = []"),
        S([1, 2], "= 4 + (1 + (5 + 0))", "lst = []", "Lista vazia: <b>caso base</b>. Devolve 0 sem fazer nenhuma chamada nova."),
        S(3, "= 4 + (1 + 5)", "primeiro = 5 · soma([]) = 0", "Agora as chamadas voltam. A que tinha primeiro = 5 termina sua linha: 5 + 0 = 5."),
        S(3, "= 4 + 6", "primeiro = 1 · soma([5]) = 5", "A chamada com primeiro = 1 termina: 1 + 5 = 6."),
        S(3, "= 10", "primeiro = 4 · soma([1, 5]) = 6", "A primeira chamada termina: 4 + 6 = 10.")
      ] },
    { id: "l2", kind: "predict", title: "Contar positivos",
      prompt: "Leia a função com calma e descubra o resultado sem rodar.",
      code: `pub fn conta_positivos(lst: List(Int)) -> Int {
  case lst {
    [] -> 0
    [primeiro, ..resto] ->
      case primeiro > 0 {
        True -> 1 + conta_positivos(resto)
        False -> conta_positivos(resto)
      }
  }
}`,
      call: "conta_positivos([3, -1, 0, 2])", options: ["3", "2", "4", "1"], answer: "2",
      hint: "Teste cada elemento com primeiro > 0. Atenção ao 0.",
      explain: "Quando o teste dá False, a função só segue com o resto sem somar nada. O 0 é a armadilha: <b>0 > 0 é False</b>. Casos de fronteira como esse aparecem muito em prova.",
      trace: [
        S(0, "conta_positivos([3, -1, 0, 2])", "lst = [3, -1, 0, 2]", "Chamada inicial."),
        S([4, 5], "= 1 + conta_positivos([-1, 0, 2])", "primeiro = 3 · 3 > 0 é True", "Ramo True: conta 1 e segue com o resto."),
        S([4, 6], "= 1 + conta_positivos([0, 2])", "primeiro = -1 · -1 > 0 é False", "Ramo False: não conta nada, a expressão não ganha nenhum + 1."),
        S([4, 6], "= 1 + conta_positivos([2])", "primeiro = 0 · 0 > 0 é False", "O 0 não é positivo. Essa é a armadilha."),
        S([4, 5], "= 1 + (1 + conta_positivos([]))", "primeiro = 2 · 2 > 0 é True"),
        S(2, "= 1 + (1 + 0)", "lst = []", "Caso base: devolve 0."),
        S(5, "= 1 + 1", "primeiro = 2 · conta_positivos([]) = 0", "Voltando: a chamada com primeiro = 2 devolve 1 + 0 = 1. As chamadas com 0 e -1 passaram pelo ramo False e só repassam esse 1."),
        S(5, "= 2", "primeiro = 3 · conta_positivos([-1, 0, 2]) = 1", "A primeira chamada termina: 1 + 1 = 2.")
      ] },
    { id: "l3", kind: "fill", title: "Dobrar cada elemento",
      prompt: "A saída tem o mesmo tamanho da entrada, com cada número multiplicado por 2. Complete a construção da lista.",
      code: `pub fn dobrar(lst: List(Int)) -> List(Int) {
  case lst {
    [] -> {{0}}
    [primeiro, ..resto] -> [{{1}}, ..{{2}}]
  }

const KIND = { fill: "Complete o código", predict: "Qual o resultado?", bug: "Ache o erro" };
const TOTAL = WORLDS.reduce((s, w) => s + w.levels.length, 0) * 3;

// ---------- estado ----------
const KEY = "oficina-recursao-v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { progress = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }

let view = { type: "intro", w: 0 };
let run = null;

function unlocked(w, l) { return l === 0 || progress[WORLDS[w].levels[l - 1].id] != null; }

// ---------- utilidades ----------
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function hl(code) {
  const re = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|\b(pub|fn|case|let|type|if|import)\b|\b([A-Z][A-Za-z0-9_]*)\b|(\b\d+(?:\.\d+)?\b)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : m[4] ? "t" : "nm";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function shuffled(arr, seed) {
  const a = arr.slice(); let h = 0;
  for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  for (let i = a.length - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function starStr(n) { return "★".repeat(n) + `<span class="off">${"★".repeat(3 - n)}</span>`; }

function treeSVG(t, mark = []) {
  if (!t) return "";
  const nodes = [], edges = []; let i = 0, maxd = 0;
  (function walk(n, d) {
    if (!n) return null;
    const L = walk(n.l, d + 1);
    const me = { v: n.v, x: i++, d };
    nodes.push(me);
    const R = walk(n.r, d + 1);
    if (L) edges.push([me, L]); if (R) edges.push([me, R]);
    maxd = Math.max(maxd, d); return me;
  })(t, 0);
  const sx = 46, sy = 54, pad = 22;
  const W = (i - 1) * sx + pad * 2, H = maxd * sy + pad * 2;
  const X = n => pad + n.x * sx, Y = n => pad + n.d * sy;
  let s = `<svg class="tree" width="${W}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Árvore binária">`;
  for (const [a, b] of edges) s += `<line class="edge" x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"/>`;
  for (const n of nodes) {
    const on = mark.includes(n.v) ? " hl" : "";
    s += `<circle class="node${on}" cx="${X(n)}" cy="${Y(n)}" r="17"/><text class="${on.trim()}" x="${X(n)}" y="${Y(n)}">${n.v}</text>`;
  }
  return s + "</svg>";
}

// código resolvido, linha a linha, com as lacunas preenchidas ou a linha corrigida
function solvedLines(lv) {
  return lv.code.split("\n").map((line, i) => {
    if (lv.kind === "bug" && i === lv.bugLine) return hl(lv.fix) + `  <span class="c">// corrigida</span>`;
    if (lv.kind === "fill") {
      return line.split(/\{\{(\d+)\}\}/).map((p, j) => j % 2 ? `<span class="fillv">${esc(lv.blanks[+p][0])}</span>` : hl(p)).join("");
    }
    return hl(line);
  });
}

// ---------- mapa ----------
function renderMap() {
  const got = Object.values(progress).reduce((s, n) => s + n, 0);
  document.getElementById("score").innerHTML = `★ ${got} / ${TOTAL}`;
  let h = "";
  WORLDS.forEach((w, wi) => {
    const on = view.w === wi && view.type === "intro" ? " on" : "";
    h += `<div class="world"><button type="button" class="world-btn${on}" data-world="${wi}"><span class="wname">${w.name}</span><span class="wtag">${esc(w.tag)}</span></button>`;
    w.levels.forEach((lv, li) => {
      const ok = unlocked(wi, li), st = progress[lv.id];
      const cur = view.type === "level" && view.w === wi && view.l === li ? " on" : "";
      h += `<button type="button" class="lv${cur}${ok ? "" : " locked"}" data-w="${wi}" data-l="${li}" ${ok ? "" : 'aria-disabled="true"'}>
        <span class="n">${wi + 1}.${li + 1}</span><span>${lv.title}</span>
        <span class="st">${st != null ? starStr(st) : ok ? "" : "🔒"}</span></button>`;
    });
    h += "</div>";
  });
  document.getElementById("map").innerHTML = h;
}

// ---------- intro de mundo ----------
function renderIntro(wi) {
  const w = WORLDS[wi];
  let vis = "";
  if (w.anatomy) vis = `<div class="anatomy">${w.anatomy.map(([t, c]) => c === "arrow" ? `<span class="arrow">${esc(t)}</span>` : `<span class="chip ${c}">${esc(t)}</span>`).join("")}</div>`;
  if (w.tree) vis = `<div class="treebox" style="align-self:flex-start">${treeSVG(w.tree, [5])}<span class="cap">No(5, esq, dir)</span></div>`;
  const firstOpen = w.levels.findIndex(l => progress[l.id] == null);
  const next = firstOpen === -1 ? 0 : firstOpen;
  return `
    <div><span class="eyebrow">Mundo ${wi + 1} de ${WORLDS.length}</span><h2>Recursão com ${w.name.toLowerCase()}</h2>
    <div class="prose"><p>${w.lead}</p></div></div>
    ${vis}
    <div><h3>A receita</h3><div class="code"><pre>${hl(w.template)}</pre></div></div>
    <div class="recipe">${w.recipe.map(([q, t]) => `<div><span class="q">${q}</span><p>${esc(t)}</p></div>`).join("")}</div>
    <div class="actions"><button type="button" class="btn accent" data-go="${wi},${next}">${firstOpen === -1 ? "Rever fases" : firstOpen === 0 ? "Começar" : "Continuar"} →</button>
    <span class="eyebrow">${w.levels.length} fases</span></div>`;
}

// ---------- fase ----------
function startLevel(wi, li) {
  const lv = WORLDS[wi].levels[li];
  run = { lv, wi, li, attempts: 0, solved: false, hint: false, msg: "", step: 0,
    filled: lv.blanks ? lv.blanks.map(() => null) : null, active: 0, wrong: new Set(), picked: new Set() };
  if (lv.blanks) run.opts = lv.blanks.map((b, i) => shuffled(b, lv.id + i));
  if (lv.options) run.opts = lv.options;
}

function renderCode() {
  const lv = run.lv;
  if (lv.kind === "fill") {
    const parts = lv.code.split(/\{\{(\d+)\}\}/);
    let h = "";
    parts.forEach((p, i) => {
      if (i % 2 === 0) { h += hl(p); return; }
      const b = +p, val = run.filled[b];
      let cls = "slot";
      if (val == null) cls += " empty";
      if (run.active === b) cls += " active";
      if (run.wrong.has(b)) cls += " wrong";
      h += `<button type="button" class="${cls}" data-slot="${b}" aria-label="Lacuna ${b + 1}">${val == null ? "?" : esc(val)}</button>`;
    });
    return `<div class="code"><pre>${h}</pre></div>`;
  }
  if (lv.kind === "bug") {
    const h = lv.code.split("\n").map((ln, i) => {
      const cls = "bugline" + (run.picked.has(i) ? " wrong" : "");
      return `<button type="button" class="${cls}" data-line="${i}"><span class="ln">${i + 1}</span>${hl(ln) || " "}</button>`;
    }).join("");
    return `<div class="code">${h}</div>`;
  }
  return `<div class="code"><pre>${hl(lv.code)}</pre></div>`;
}

function renderInteract() {
  const lv = run.lv;
  if (lv.kind === "fill") {
    const b = run.active;
    return `<div class="bank"><span class="bank-label">Peças para a lacuna ${b + 1} de ${lv.blanks.length}:</span>
      <div class="tiles">${run.opts[b].map(o => `<button type="button" class="tile${run.filled[b] === o ? " chosen" : ""}" data-tile="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>
      <div class="actions"><button type="button" class="btn" data-check ${run.filled.some(v => v == null) ? "disabled" : ""}>Verificar</button>
      ${run.hint ? "" : `<button type="button" class="btn ghost" data-hint>Dica</button>`}</div>`;
  }
  if (lv.kind === "predict") {
    return `<p class="question">Qual o valor de <span class="call">${esc(lv.call)}</span>?</p>
      <div class="opts">${run.opts.map(o => {
        const c = "opt" + (run.picked.has(o) ? " wrong" : "");
        return `<button type="button" class="${c}" data-opt="${esc(o)}" ${run.picked.has(o) ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      ${run.hint ? "" : `<div class="actions"><button type="button" class="btn ghost" data-hint>Dica</button></div>`}`;
  }
  if (lv.kind === "bug") {
    return run.hint ? "" : `<div class="actions"><span class="bank-label">Clique numa linha do código.</span><button type="button" class="btn ghost" data-hint>Dica</button></div>`;
  }
}

function renderFollow() {
  const lv = run.lv, k = run.step, steps = lv.trace, cur = steps[k], last = steps.length - 1;
  let tree = lv.traceTree || null;
  for (let i = 0; i <= k; i++) if (steps[i].t) tree = steps[i].t;
  const mark = cur.m || [];
  const lines = solvedLines(lv).map((html, i) =>
    `<div class="cl${cur.ln.includes(i) ? " on" : ""}"><span class="ln">${i + 1}</span>${html || " "}</div>`).join("");
  const vars = cur.v ? cur.v.split(" · ").map(x => `<span class="vchip">${esc(x)}</span>`).join("") : "";
  const lineLabel = cur.ln.length > 1 ? `linhas ${cur.ln.map(x => x + 1).join(" e ")}` : `linha ${cur.ln[0] + 1}`;
  const expr = steps.slice(0, k + 1).map((s, i) => `<div class="step${i === k ? " cur" : ""}">${esc(s.e)}</div>`).join("");
  return `
  <section class="follow" aria-label="Acompanhar a recursão">
    <div class="follow-head">
      <h3>Acompanhe a recursão</h3>
      <div class="stepper">
        <button type="button" class="btn ghost" data-step="first" ${k === 0 ? "disabled" : ""}>Início</button>
        <button type="button" class="btn ghost" data-step="-1" ${k === 0 ? "disabled" : ""}>← Voltar</button>
        <button type="button" class="btn" data-step="1" ${k === last ? "disabled" : ""}>Próximo passo →</button>
        <span class="count">${k + 1}/${steps.length}</span>
      </div>
    </div>
    <div class="note" aria-live="polite"><b>${lineLabel}:</b> ${cur.n || "mesma ideia do passo anterior, com novos valores."}</div>
    <div class="trace">
      <div class="code lines">${lines}</div>
      <div class="side">
        ${vars ? `<div class="vars"><span class="lab">Nesta chamada</span><div class="vchips">${vars}</div></div>` : ""}
        ${tree ? `<div class="treebox">${treeSVG(tree, mark)}<span class="cap">destaque = nós deste passo</span></div>` : ""}
      </div>
    </div>
    <div class="steps"><div class="lab">Expressão até agora</div>${expr}</div>
    <span class="keys">Dica: use <kbd>←</kbd> e <kbd>→</kbd> do teclado para andar pelos passos.</span>
  </section>`;
}

function nextTarget() {
  const { wi, li } = run;
  if (li + 1 < WORLDS[wi].levels.length) return { label: "Próxima fase →", go: `${wi},${li + 1}` };
  if (wi + 1 < WORLDS.length) return { label: `Mundo ${WORLDS[wi + 1].name} →`, intro: wi + 1 };
  return null;
}

function renderLevel() {
  const lv = run.lv, w = WORLDS[run.wi];
  let h = `<div><span class="eyebrow">${w.name} · fase ${run.li + 1} de ${w.levels.length} · <b>${KIND[lv.kind]}</b></span>
    <h2>${lv.title}</h2><div class="prose"><p>${esc(lv.prompt)}</p></div></div>`;
  if (!run.solved) {
    if (lv.tree) h += `<div class="treebox" style="align-self:flex-start">${treeSVG(lv.tree)}</div>`;
    h += renderCode();
    h += renderInteract();
    if (run.msg) h += `<div class="feedback bad" role="status">${run.msg}</div>`;
    if (run.hint) h += `<div class="feedback hint"><b>Dica:</b> ${esc(lv.hint)}</div>`;
    return h;
  }
  const st = starsFor(run.attempts), nx = nextTarget();
  h += `<section class="result">
    <div class="won"><span class="bigstars" aria-label="${st} de 3 estrelas">${starStr(st)}</span>
      <h3>${run.attempts === 0 ? "De primeira!" : run.attempts === 1 ? "Resolvido com um erro" : `Resolvido com ${run.attempts} erros`}</h3></div>
    <div class="prose"><p>${lv.explain}</p></div>
    ${renderFollow()}
    <div class="actions">
      ${nx ? `<button type="button" class="btn accent" ${nx.go ? `data-go="${nx.go}"` : `data-world="${nx.intro}"`}>${nx.label}</button>` : `<span class="eyebrow"><b>Você terminou todas as fases.</b></span>`}
      <button type="button" class="btn ghost" data-retry>Refazer fase</button>
    </div></section>`;
  return h;
}

function starsFor(a) { return a === 0 ? 3 : a === 1 ? 2 : 1; }

function win() {
  run.solved = true; run.msg = ""; run.step = 0;
  const st = starsFor(run.attempts);
  progress[run.lv.id] = Math.max(progress[run.lv.id] || 0, st);
  save();
}

const WRONG_MSG = {
  fill: n => `${n === 1 ? "Uma lacuna está errada" : n + " lacunas estão erradas"}. Elas ficaram marcadas no código.`,
  predict: () => "Não é esse. Siga a recursão elemento por elemento.",
  bug: () => "Essa linha está certa. Pense no que a saída tem de diferente do esperado."
};

// ---------- render ----------
function render(scrollTop) {
  renderMap();
  const main = document.getElementById("main");
  main.innerHTML = view.type === "intro" ? renderIntro(view.w) : renderLevel();
  if (scrollTop) main.scrollIntoView({ block: "start", behavior: "auto" });
}
function goLevel(wi, li) {
  if (!unlocked(wi, li)) return;
  view = { type: "level", w: wi, l: li }; startLevel(wi, li); render(true);
}
function moveStep(how) {
  const n = run.lv.trace.length;
  run.step = how === "first" ? 0 : Math.min(n - 1, Math.max(0, run.step + how));
  render();
  const btn = document.querySelector(`[data-step="${how}"]:not(:disabled)`) || document.querySelector('[data-step="1"]:not(:disabled)') || document.querySelector('[data-step="-1"]:not(:disabled)');
  if (btn && document.activeElement === document.body) btn.focus({ preventScroll: true });
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.world != null) { view = { type: "intro", w: +t.dataset.world }; render(true); return; }
  if (t.dataset.w != null) { goLevel(+t.dataset.w, +t.dataset.l); return; }
  if (t.dataset.go) { const [a, b] = t.dataset.go.split(",").map(Number); goLevel(a, b); return; }
  if (!run) return;
  if (t.dataset.slot != null) { run.active = +t.dataset.slot; render(); return; }
  if (t.dataset.tile != null) {
    const b = run.active;
    run.filled[b] = t.dataset.tile; run.wrong.delete(b); run.msg = "";
    const nextEmpty = run.filled.findIndex(v => v == null);
    if (nextEmpty !== -1) run.active = nextEmpty;
    render(); return;
  }
  if (t.hasAttribute("data-check")) {
    run.wrong = new Set();
    run.filled.forEach((v, i) => { if (v !== run.lv.blanks[i][0]) run.wrong.add(i); });
    if (run.wrong.size === 0) win();
    else { run.attempts++; run.msg = WRONG_MSG.fill(run.wrong.size); run.active = [...run.wrong][0]; }
    render(); return;
  }
  if (t.dataset.opt != null) {
    if (t.dataset.opt === run.lv.answer) win();
    else { run.picked.add(t.dataset.opt); run.attempts++; run.msg = WRONG_MSG.predict(); }
    render(); return;
  }
  if (t.dataset.line != null) {
    const i = +t.dataset.line;
    if (i === run.lv.bugLine) win();
    else if (!run.picked.has(i)) { run.picked.add(i); run.attempts++; run.msg = WRONG_MSG.bug(); }
    render(); return;
  }
  if (t.hasAttribute("data-hint")) { run.hint = true; render(); return; }
  if (t.dataset.step) { moveStep(t.dataset.step === "first" ? "first" : +t.dataset.step); return; }
  if (t.hasAttribute("data-retry")) { startLevel(run.wi, run.li); render(true); return; }
});

document.addEventListener("keydown", e => {
  if (!run || !run.solved || view.type !== "level" || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight") { e.preventDefault(); moveStep(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); moveStep(-1); }
});

let resetArmed = false;
document.getElementById("reset").addEventListener("click", e => {
  const b = e.currentTarget;
  if (!resetArmed) { resetArmed = true; b.textContent = "Confirmar: apagar estrelas?"; setTimeout(() => { resetArmed = false; b.textContent = "Zerar progresso"; }, 4000); return; }
  progress = {}; save(); resetArmed = false; b.textContent = "Zerar progresso";
  view = { type: "intro", w: 0 }; run = null; render(true);
});

render(false);

</script>
</body>
</html>
